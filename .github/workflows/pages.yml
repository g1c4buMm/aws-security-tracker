name: Build and deploy tracker

on:
  push:
    branches: [main]
    paths: ["data/**", "src/**", "i18n/**", "scripts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge week files (skips launches already present)
        run: |
          for f in data/weeks/*.json; do python3 scripts/add_week.py "$f"; done
      - name: Build page
        run: python3 scripts/build.py --updated "$(TZ=America/Sao_Paulo date +%F)"
      - name: Keep only the published page
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
